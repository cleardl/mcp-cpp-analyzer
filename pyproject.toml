[project]
name = "mcp-cpp-semantic-search"
version = "0.4.0"
description = "C/C++ semantic search for AI agents, powered by clangd"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp[code-mode]==4.2.0",
    "pydantic>=2.12,<3",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
benchmark = [
    "tiktoken>=0.12",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
    "pefile>=2024.8.26; sys_platform == 'win32'",
]
